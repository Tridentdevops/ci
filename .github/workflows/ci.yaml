name: product-catlog-ci
on: 
    pull_request:
        branches:
            - master

jobs:

    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: install go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.21

            - name: download dependencies
              run: go mod download

            - name: build
              run: go build -o product-catlog-service ./product-catlog/main.go
        
            - name: run tests
              run: go test ./product-catlog/...
              
              
    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: golangci-lint
              run: |
                  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.52.2
                  golangci-lint run ./...


    docker:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: install docker buildx
              uses: docker/setup-buildx-action@v2

            - name: login to dockerhub
              uses: docker/login-action@v2  
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: build and push image
              uses: docker/build-push-action@v4
              with:
                  context: ./product-catlog
                  push: true    
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-catlog:${{ github.run_id }}
    
                  
    update-k8-maifest:
        needs: docker
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v3
              with:
                  token: ${{ secrets.SGITHUB_TOKEN }}

            - name: update k8s manifest
              run: |
                  sed -i 's|image: .*|image: '"${{ secrets.DOCKERHUB_USERNAME }}"'
                  /product-catlog:'"${{ github.run_id }}"'|g' ./product-catlog-deployment.yaml

            - name: commit and push changes
              run: |
                  git config --global user.name "github-actions"
                  git config --global user.email " 
                  git commit -am "Update k8s manifest for product-catlog service"
                  git push origin main